services:
  db:
    image: postgres:16-alpine
    container_name: bekzhan-pg
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: bekzhan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bekzhan"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
