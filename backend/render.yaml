databases:
  - name: bekzhan-db
    plan: free
    databaseName: bekzhan
    ipAllowList: []

services:
  - type: web
    name: bekzhan-api
    plan: free
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bekzhan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://arstanaliev.vercel.app/"]'
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false
