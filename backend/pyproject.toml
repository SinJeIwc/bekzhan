[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.135.3",
    "pillow>=12.2.0",
    "psycopg2-binary>=2.9.11",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "python-multipart>=0.0.26",
    "sqlmodel>=0.0.38",
    "cloudinary>=1.40.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "FAST"]

[dependency-groups]
dev = [
    "ruff>=0.15.10",
]
